<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <script src="shared/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Math Games with Bad Drawings — interactive</title>
  <link rel="stylesheet" href="shared/style.css">
  <style>
    .hero { display: flex; align-items: flex-end; justify-content: center; gap: 10px; }
    .hero .fig { width: 110px; flex: none; }
    .hero .titles { flex: 0 1 640px; }
    .section-title { display: flex; align-items: baseline; gap: 12px; }
    .section-title .num { color: var(--red); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
    .card {
      position: relative; display: block; padding: 12px 16px 10px; text-decoration: none; color: var(--ink);
      background: var(--card); border: 2.5px solid var(--ink); border-radius: var(--sketchy);
      transition: transform .12s; min-height: 84px;
    }
    .card:nth-child(odd) { transform: rotate(-.6deg); }
    .card:nth-child(even) { transform: rotate(.5deg); }
    .card:hover { transform: rotate(-1.5deg) scale(1.03); }
    .card .name { font: 700 27px/1.05 var(--hand); padding-right: 34px; }
    .card .players { font: 600 18px var(--hand); color: var(--muted-2); margin-top: 2px; }
    .card.ready .players { color: var(--red); }
    .card.ready { border-color: var(--blue); box-shadow: 3px 4px 0 color-mix(in srgb, var(--blue) 25%, transparent); }
    .card.ready .name { color: var(--blue-dark); }
    .card.soon { border-style: dashed; border-color: var(--line); color: var(--muted-2); pointer-events: none; }
    .card.soon .name { color: var(--muted-2); }
    .card .tag { position: absolute; right: 10px; top: 6px; font: 700 18px var(--hand); color: var(--line); }
    .card .tag.go { color: var(--red); }
    .card.minor .name { font-size: 23px; }
    @media (max-width: 640px) {
      .hero .fig { width: 54px; }
      .hero h1 { font-size: 40px; }
      .subtitle { font-size: 21px; }
      .grid { grid-template-columns: 1fr 1fr; gap: 10px; }
      .card { min-height: 0; padding: 8px 10px 6px; }
      .card .name, .card.minor .name { font-size: 21px; padding-right: 14px; }
      .card .players { font-size: 16px; }
      .card .tag { right: 6px; top: 2px; font-size: 16px; }
      .card.soon .tag { display: none; }
      h2.section-title { font-size: 30px; margin-top: 28px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <nav class="topbar">
      <span></span>
      <div class="lang-toggle"><button class="theme-toggle" type="button"></button><button data-lang="ru">RU</button><button data-lang="en">EN</button></div>
    </nav>
    <header class="hero">
      <div class="fig" id="hero0"></div>
      <div class="titles">
        <h1 data-i18n="site.title"></h1>
        <svg class="underline" viewBox="0 0 520 14" preserveAspectRatio="none"><path d="M4 8 Q130 2 260 7 T516 6" stroke="var(--blue)" stroke-width="4" fill="none" stroke-linecap="round"/></svg>
        <p class="subtitle" data-i18n="site.subtitle"></p>
      </div>
      <div class="fig" id="hero1"></div>
    </header>
    <main id="catalog"></main>
    <p class="credit" data-i18n-html="site.credit"></p>
  </div>
  <script type="module">
    import { t, getLang, applyI18n, plural } from './shared/i18n.js';
    import { injectDefs, figureSVG, PALETTE } from './shared/sketch.js';
    import { SECTIONS, GAMES } from './shared/games.js';
    {
      const ROMAN = ['I', 'II', 'III', 'IV', 'V'];
      // "2 игрока", "2–6 игроков": the noun agrees with the upper bound.
      const playersLabel = ([a, b]) => plural(b, 'site.players').replace(/^\d+/, a === b ? String(b) : `${a}–${b}`);
      function render() {
        const L = getLang();
        document.getElementById('catalog').innerHTML = SECTIONS.map((s, i) => `
          <h2 class="section-title"><span class="num">${ROMAN[i]}</span> ${s[L]}</h2>
          <div class="grid">${GAMES.filter((g) => g.section === s.id).map((g) => {
            const ready = g.status === 'ready';
            return `<a class="card ${ready ? 'ready' : 'soon'}${g.featured ? '' : ' minor'}" ${ready ? `href="games/${g.slug}/index.html"` : ''}>
              <span class="tag${ready ? ' go' : ''}">${ready ? '→' : t('site.soon')}</span>
              <div class="name">${g[L]}</div>
              <div class="players">${playersLabel(g.players)}</div>
            </a>`;
          }).join('')}</div>`).join('');
      }
      injectDefs();
      document.getElementById('hero0').innerHTML = figureSVG({ color: PALETTE.blue, mood: 'happy', pose: 'wave', face: 'right', seed: 5 });
      document.getElementById('hero1').innerHTML = figureSVG({ color: PALETTE.red, mood: 'smug', pose: 'point', face: 'left', seed: 9 });
      applyI18n();
      render();
      document.addEventListener('mg:lang', render);
    }
  </script>
</body>
</html>
