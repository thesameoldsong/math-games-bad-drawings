<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Neighbors · Math Games with Bad Drawings</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="game">
  <div class="page">
    <header class="game-top">
      <a class="back" href="../../index.html" data-i18n-title="site.home" aria-label="back">←</a>
      <h1 data-i18n="nb.title"></h1>
      <div class="lang-toggle"><button data-lang="ru">RU</button><button data-lang="en">EN</button></div>
    </header>

    <main class="arena n2">
      <div class="player p0" data-p="0">
        <div class="fig-wrap"><div class="bubble blue"></div><div class="fig"></div></div>
        <input type="text" class="name" maxlength="14" spellcheck="false">
        <div class="score"></div>
      </div>
      <div class="board-wrap">
        <svg id="board" role="img"></svg>
        <div class="cover" id="cover" hidden>
          <div class="result-card">
            <p class="cover-title hand" data-i18n="nb.pass.title"></p>
            <div class="result-text" id="cover-who"></div>
            <button class="btn primary" id="cover-go" data-i18n="nb.pass.show"></button>
          </div>
        </div>
        <div class="result" id="result" hidden>
          <div class="result-card">
            <div class="result-text" id="result-text"></div>
            <p class="result-sub hand" id="result-sub"></p>
            <p class="result-wait hand" id="result-wait" hidden></p>
            <button class="btn primary" id="again" data-i18n="nb.again"></button>
          </div>
        </div>
      </div>
      <div class="player p1" data-p="1">
        <div class="fig-wrap"><div class="bubble red"></div><div class="fig"></div></div>
        <input type="text" class="name" maxlength="14" spellcheck="false">
        <div class="score"></div>
      </div>
      <div class="player p2" data-p="2" hidden>
        <div class="fig-wrap"><div class="bubble green"></div><div class="fig"></div></div>
        <input type="text" class="name" maxlength="14" spellcheck="false">
        <div class="score"></div>
      </div>
      <div class="player p3" data-p="3" hidden>
        <div class="fig-wrap"><div class="bubble orange"></div><div class="fig"></div></div>
        <input type="text" class="name" maxlength="14" spellcheck="false">
        <div class="score"></div>
      </div>
      <div class="status" id="status"></div>

      <nav class="toolbar">
        <div class="tools tools-info">
          <button class="tool" data-icon="how" data-label="ui.how" data-sheet="how"></button>
          <button class="tool" data-icon="tips" data-label="ui.tips" data-sheet="tips"></button>
          <button class="tool" data-icon="origin" data-label="ui.origin" data-sheet="origin"></button>
        </div>
        <div class="tools tools-play">
          <button class="tool" data-icon="settings" data-label="ui.settings" data-sheet="settings"></button>
          <button class="tool" data-icon="online" data-label="net.btn" id="online"></button>
          <button class="tool" data-icon="undo" data-label="ui.undo" id="undo"></button>
          <button class="tool" data-icon="restart" data-label="ui.restart" id="new"></button>
        </div>
      </nav>
    </main>

    <p class="credit" data-i18n-html="site.credit"></p>
  </div>

  <dialog class="mg-dialog" id="sheet-how">
    <h3 data-i18n="nb.h.how"></h3>
    <div data-i18n-html="nb.how"></div>
    <div class="actions"><button class="btn primary" data-close data-i18n="ui.close"></button></div>
  </dialog>
  <dialog class="mg-dialog" id="sheet-tips">
    <h3 data-i18n="nb.h.tips"></h3>
    <div data-i18n-html="nb.tips"></div>
  </dialog>
  <dialog class="mg-dialog" id="sheet-origin">
    <h3 data-i18n="nb.h.origin"></h3>
    <div data-i18n-html="nb.origin"></div>
    <p class="credit" data-i18n-html="site.credit"></p>
  </dialog>
  <dialog class="mg-dialog" id="sheet-settings">
    <h3 data-i18n="ui.settings.title"></h3>
    <label class="field"><span data-i18n="nb.mode"></span>
      <select id="mode">
        <option value="solo" data-i18n="nb.mode.solo"></option>
        <option value="pvp" data-i18n="nb.mode.pvp"></option>
        <option value="easy" data-i18n="nb.mode.easy"></option>
        <option value="normal" data-i18n="nb.mode.normal"></option>
        <option value="hard" data-i18n="nb.mode.hard"></option>
      </select>
    </label>
    <label class="field" id="players-field"><span data-i18n="nb.players"></span>
      <select id="players">
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
      </select>
    </label>
    <label class="field"><span data-i18n="nb.source"></span>
      <select id="source">
        <option value="die" data-i18n="nb.source.die"></option>
        <option value="deck" data-i18n="nb.source.deck"></option>
      </select>
    </label>
    <label class="field" id="secret-field"><span data-i18n="nb.boards"></span>
      <select id="secret">
        <option value="open" data-i18n="nb.boards.open"></option>
        <option value="secret" data-i18n="nb.boards.secret"></option>
      </select>
    </label>
    <label class="field" id="hints-field"><span data-i18n="nb.hints"></span>
      <select id="hints">
        <option value="off" data-i18n="nb.hints.off"></option>
        <option value="on" data-i18n="nb.hints.on"></option>
      </select>
    </label>
    <p class="hand settings-note" id="settings-note"></p>
    <div class="actions"><button class="btn primary" data-close data-i18n="ui.close"></button></div>
  </dialog>

  <script type="module" src="game.js"></script>
</body>
</html>
