<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <script src="../../shared/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Starlitaire · Math Games with Bad Drawings</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="game">
  <div class="page">
    <header class="game-top">
      <a class="back" href="../../index.html" data-i18n-title="site.home" aria-label="back">←</a>
      <h1 data-i18n="star.title"></h1>
      <div class="lang-toggle"><button class="theme-toggle" type="button"></button><button data-lang="ru">RU</button><button data-lang="en">EN</button></div>
    </header>

    <main class="arena">
      <div class="player p0 active" data-p="0">
        <div class="fig-wrap"><div class="bubble blue"></div><div class="fig"></div></div>
        <input type="text" class="name" maxlength="14" spellcheck="false">
        <div class="score"></div>
      </div>
      <div class="board-wrap">
        <svg id="board" role="img"></svg>
        <div class="result" id="result" hidden>
          <div class="result-card">
            <div class="result-text" id="result-text"></div>
            <p class="result-sub hand" id="result-sub"></p>
            <div class="result-btns">
              <button class="btn" id="again" data-i18n="star.again"></button>
              <button class="btn primary" id="random" data-i18n="star.random"></button>
            </div>
          </div>
        </div>
      </div>
      <div class="player p1 active" data-p="1">
        <div class="fig-wrap"><div class="bubble red"></div><div class="fig"></div></div>
        <div class="name helper" data-i18n="star.p1"></div>
        <div class="score" id="rule-label"></div>
      </div>
      <div class="status">
        <div id="status"></div>
        <div class="chips" id="chips"></div>
      </div>

      <nav class="toolbar">
        <div class="tools tools-info">
          <button class="tool" data-icon="how" data-label="ui.how" data-sheet="how"></button>
          <button class="tool" data-icon="tips" data-label="ui.tips" data-sheet="tips"></button>
          <button class="tool" data-icon="origin" data-label="ui.origin" data-sheet="origin"></button>
        </div>
        <div class="tools tools-play">
          <button class="tool" data-icon="settings" data-label="ui.settings" data-sheet="settings"></button>
          <button class="tool" data-icon="undo" data-label="ui.undo" id="undo"></button>
          <button class="tool" data-icon="restart" data-label="ui.restart" id="new"></button>
        </div>
      </nav>
    </main>

    <p class="credit" data-i18n-html="site.credit"></p>
  </div>

  <dialog class="mg-dialog" id="sheet-how">
    <h3 data-i18n="star.h.how"></h3>
    <div data-i18n-html="star.how"></div>
    <div class="actions"><button class="btn primary" data-close data-i18n="ui.close"></button></div>
  </dialog>
  <dialog class="mg-dialog" id="sheet-tips">
    <h3 data-i18n="star.h.tips"></h3>
    <div data-i18n-html="star.tips"></div>
  </dialog>
  <dialog class="mg-dialog" id="sheet-origin">
    <h3 data-i18n="star.h.origin"></h3>
    <div data-i18n-html="star.origin"></div>
    <p class="credit" data-i18n-html="site.credit"></p>
  </dialog>
  <dialog class="mg-dialog" id="sheet-settings">
    <h3 data-i18n="ui.settings.title"></h3>
    <label class="field"><span data-i18n="star.dots"></span>
      <select id="dots"></select>
    </label>
    <label class="field"><span data-i18n="star.rule"></span>
      <select id="rule"></select>
    </label>
    <label class="field"><span data-i18n="star.hint"></span>
      <select id="hint">
        <option value="always" data-i18n="star.hint.always"></option>
        <option value="miss" data-i18n="star.hint.miss"></option>
        <option value="never" data-i18n="star.hint.never"></option>
      </select>
    </label>
    <label class="field"><span data-i18n="star.guess"></span>
      <select id="guess">
        <option value="on" data-i18n="star.guess.on"></option>
        <option value="off" data-i18n="star.guess.off"></option>
      </select>
    </label>
    <p class="hand settings-note" data-i18n="star.online.none"></p>
    <div class="actions"><button class="btn primary" data-close data-i18n="ui.close"></button></div>
  </dialog>

  <script type="module" src="game.js"></script>
</body>
</html>
