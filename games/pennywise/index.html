<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <script src="../../shared/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pennywise · Math Games with Bad Drawings</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="game">
  <div class="page">
    <header class="game-top">
      <a class="back" href="../../index.html" data-i18n-title="site.home" aria-label="back">←</a>
      <h1 data-i18n="pw.title"></h1>
      <div class="lang-toggle"><button class="theme-toggle" type="button"></button><button data-lang="ru">RU</button><button data-lang="en">EN</button></div>
    </header>

    <main class="arena" id="arena">
      <div class="side side-l"></div>
      <div class="board-wrap">
        <svg id="board" role="img"></svg>
        <div class="result" id="result" hidden>
          <div class="result-card">
            <div class="result-text" id="result-text"></div>
            <p class="result-sub hand" id="result-sub"></p>
            <p class="result-wait hand" id="result-wait" hidden></p>
            <button class="btn primary" id="again" data-i18n="pw.again"></button>
          </div>
        </div>
      </div>
      <div class="side side-r"></div>
      <div class="status" id="status"></div>

      <nav class="toolbar">
        <div class="tools tools-info">
          <button class="tool" data-icon="how" data-label="ui.how" data-sheet="how"></button>
          <button class="tool" data-icon="tips" data-label="ui.tips" data-sheet="tips"></button>
          <button class="tool" data-icon="origin" data-label="ui.origin" data-sheet="origin"></button>
        </div>
        <div class="tools tools-play">
          <button class="tool" data-icon="settings" data-label="ui.settings" data-sheet="settings"></button>
          <button class="tool" data-icon="online" data-label="net.btn" id="online"></button>
          <button class="tool" data-icon="undo" data-label="ui.undo" id="undo"></button>
          <button class="tool" data-icon="restart" data-label="ui.restart" id="new"></button>
        </div>
      </nav>
    </main>

    <p class="credit" data-i18n-html="site.credit"></p>
  </div>

  <dialog class="mg-dialog" id="sheet-how">
    <h3 data-i18n="pw.h.how"></h3>
    <div data-i18n-html="pw.how"></div>
    <div class="actions"><button class="btn primary" data-close data-i18n="ui.close"></button></div>
  </dialog>
  <dialog class="mg-dialog" id="sheet-tips">
    <h3 data-i18n="pw.h.tips"></h3>
    <div data-i18n-html="pw.tips"></div>
  </dialog>
  <dialog class="mg-dialog" id="sheet-origin">
    <h3 data-i18n="pw.h.origin"></h3>
    <div data-i18n-html="pw.origin"></div>
    <p class="credit" data-i18n-html="site.credit"></p>
  </dialog>
  <dialog class="mg-dialog" id="sheet-settings">
    <h3 data-i18n="ui.settings.title"></h3>
    <label class="field" id="f-players"><span data-i18n="pw.players"></span>
      <select id="players">
        <option value="2">2</option><option value="3">3</option><option value="4">4</option>
        <option value="5">5</option><option value="6">6</option>
      </select>
    </label>
    <label class="field" id="f-mode"><span data-i18n="pw.mode"></span>
      <select id="mode">
        <option value="pvp" data-i18n="pw.mode.pvp"></option>
        <option value="easy" data-i18n="pw.mode.easy"></option>
        <option value="normal" data-i18n="pw.mode.normal"></option>
        <option value="hard" data-i18n="pw.mode.hard"></option>
      </select>
    </label>
    <label class="field"><span data-i18n="pw.coins"></span>
      <select id="coins">
        <option value="classic" data-i18n="pw.c.classic"></option>
        <option value="coprimes" data-i18n="pw.c.coprimes"></option>
        <option value="darlene" data-i18n="pw.c.darlene"></option>
        <option value="nodimes" data-i18n="pw.c.nodimes"></option>
        <option value="sugar" data-i18n="pw.c.sugar"></option>
        <option value="taylor" data-i18n="pw.c.taylor"></option>
        <option value="djibouti" data-i18n="pw.c.djibouti"></option>
        <option value="chile" data-i18n="pw.c.chile"></option>
        <option value="bhutan" data-i18n="pw.c.bhutan"></option>
        <option value="azerbaijan" data-i18n="pw.c.azerbaijan"></option>
        <option value="madagascar" data-i18n="pw.c.madagascar"></option>
      </select>
    </label>
    <p class="hand purse-note" id="purse-note"></p>
    <label class="field"><span data-i18n="pw.rule"></span>
      <select id="rule">
        <option value="classic" data-i18n="pw.r.classic"></option>
        <option value="perfect" data-i18n="pw.r.perfect"></option>
        <option value="more" data-i18n="pw.r.more"></option>
      </select>
    </label>
    <p class="hand settings-note" id="settings-note"></p>
    <div class="actions"><button class="btn primary" data-close data-i18n="ui.close"></button></div>
  </dialog>

  <script type="module" src="game.js"></script>
</body>
</html>
