<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Patterns II · Math Games with Bad Drawings</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="game">
  <div class="page">
    <header class="game-top">
      <a class="back" href="../../index.html" data-i18n-title="site.home" aria-label="back">←</a>
      <h1 data-i18n="pii.title"></h1>
      <div class="lang-toggle"><button data-lang="ru">RU</button><button data-lang="en">EN</button></div>
    </header>

    <main class="arena pii-arena n2" id="arena">
      <div class="player p0" data-p="0">
        <div class="fig-wrap"><div class="bubble"></div><div class="fig"></div></div>
        <input type="text" class="name" maxlength="14" spellcheck="false">
        <div class="score"></div>
      </div>
      <div class="player p1 flip" data-p="1">
        <div class="fig-wrap"><div class="bubble"></div><div class="fig"></div></div>
        <input type="text" class="name" maxlength="14" spellcheck="false">
        <div class="score"></div>
      </div>
      <div class="player p2" data-p="2" hidden>
        <div class="fig-wrap"><div class="bubble"></div><div class="fig"></div></div>
        <input type="text" class="name" maxlength="14" spellcheck="false">
        <div class="score"></div>
      </div>
      <div class="player p3 flip" data-p="3" hidden>
        <div class="fig-wrap"><div class="bubble"></div><div class="fig"></div></div>
        <input type="text" class="name" maxlength="14" spellcheck="false">
        <div class="score"></div>
      </div>
      <div class="player p4" data-p="4" hidden>
        <div class="fig-wrap"><div class="bubble"></div><div class="fig"></div></div>
        <input type="text" class="name" maxlength="14" spellcheck="false">
        <div class="score"></div>
      </div>

      <div class="board-wrap">
        <div class="pii-board">
          <svg id="board" role="img"></svg>
          <div class="cover" id="cover" hidden>
            <div class="ctitle" id="cover-title"></div>
            <div class="cnote" id="cover-note"></div>
            <button class="btn primary" id="uncover"></button>
          </div>
        </div>
        <div class="pal" id="pal"></div>
        <div class="acts" id="acts"></div>
        <div class="result" id="result" hidden>
          <div class="result-card">
            <div class="result-sub hand" id="result-sub"></div>
            <div class="result-text" id="result-text"></div>
            <div class="result-list" id="result-list"></div>
            <p class="result-wait hand" id="result-wait" hidden></p>
            <div class="result-btns">
              <button class="btn" id="look" data-i18n="pii.look"></button>
              <button class="btn primary" id="again"></button>
            </div>
          </div>
        </div>
      </div>
      <div class="status" id="status"></div>

      <nav class="toolbar">
        <div class="tools tools-info">
          <button class="tool" data-icon="how" data-label="ui.how" data-sheet="how"></button>
          <button class="tool" data-icon="tips" data-label="ui.tips" data-sheet="tips"></button>
          <button class="tool" data-icon="origin" data-label="ui.origin" data-sheet="origin"></button>
        </div>
        <div class="tools tools-play">
          <button class="tool" data-icon="settings" data-label="ui.settings" data-sheet="settings"></button>
          <button class="tool" data-icon="online" data-label="net.btn" id="online"></button>
          <button class="tool" data-icon="undo" data-label="ui.undo" id="undo"></button>
          <button class="tool" data-icon="restart" data-label="ui.restart" id="new"></button>
        </div>
      </nav>
    </main>

    <p class="credit" data-i18n-html="site.credit"></p>
  </div>

  <dialog class="mg-dialog" id="sheet-how">
    <h3 data-i18n="pii.h.how"></h3>
    <div data-i18n-html="pii.how"></div>
    <div class="actions"><button class="btn primary" data-close data-i18n="ui.close"></button></div>
  </dialog>
  <dialog class="mg-dialog" id="sheet-tips">
    <h3 data-i18n="pii.h.tips"></h3>
    <div data-i18n-html="pii.tips"></div>
  </dialog>
  <dialog class="mg-dialog" id="sheet-origin">
    <h3 data-i18n="pii.h.origin"></h3>
    <div data-i18n-html="pii.origin"></div>
    <p class="credit" data-i18n-html="site.credit"></p>
  </dialog>
  <dialog class="mg-dialog" id="sheet-settings">
    <h3 data-i18n="ui.settings.title"></h3>
    <label class="field"><span data-i18n="pii.designer"></span>
      <select id="designer">
        <option value="cpu" data-i18n="pii.designer.cpu"></option>
        <option value="rotate" data-i18n="pii.designer.rotate"></option>
      </select>
    </label>
    <label class="field"><span data-i18n="pii.players"></span>
      <select id="players">
        <option value="1" data-i18n="pii.players.solo"></option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </select>
    </label>
    <label class="field" id="bots-field"><span data-i18n="pii.bots"></span>
      <select id="bots">
        <option value="0">0</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
      </select>
    </label>
    <label class="field" id="level-field"><span data-i18n="pii.level"></span>
      <select id="level">
        <option value="easy" data-i18n="pii.level.easy"></option>
        <option value="normal" data-i18n="pii.level.normal"></option>
        <option value="hard" data-i18n="pii.level.hard"></option>
      </select>
    </label>
    <p class="hand settings-note" id="settings-note"></p>
    <div class="actions"><button class="btn primary" data-close data-i18n="ui.close"></button></div>
  </dialog>

  <script type="module" src="game.js"></script>
</body>
</html>
