<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Franco-Prussian Labyrinth · Math Games with Bad Drawings</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="game">
  <div class="page">
    <header class="game-top">
      <a class="back" href="../../index.html" data-i18n-title="site.home" aria-label="back">←</a>
      <h1 data-i18n="fpl.title"></h1>
      <div class="lang-toggle"><button data-lang="ru">RU</button><button data-lang="en">EN</button></div>
    </header>

    <main class="arena">
      <div class="player p0" data-p="0">
        <div class="fig-wrap"><div class="bubble blue"></div><div class="fig"></div></div>
        <input type="text" class="name" maxlength="14" spellcheck="false">
        <div class="score"></div>
      </div>
      <div class="board-wrap">
        <svg id="board" role="img"></svg>
        <div class="build-bar" id="build-bar" hidden>
          <button class="btn small" id="b-random" data-i18n="fpl.b.random"></button>
          <button class="btn small" id="b-clear" data-i18n="fpl.b.clear"></button>
          <button class="btn small primary" id="b-ready" data-i18n="fpl.b.ready"></button>
        </div>
        <div class="cover" id="cover" hidden>
          <div class="cover-card">
            <div class="cover-text hand" id="cover-text"></div>
            <p class="cover-sub" id="cover-sub"></p>
            <button class="btn primary" id="cover-go"></button>
          </div>
        </div>
        <div class="result" id="result" hidden>
          <div class="result-card">
            <div class="result-text" id="result-text"></div>
            <p class="result-sub hand" id="result-sub"></p>
            <p class="result-wait hand" id="result-wait" hidden></p>
            <div class="result-btns">
              <button class="btn" id="peek" data-i18n="fpl.peek"></button>
              <button class="btn primary" id="again" data-i18n="fpl.again"></button>
            </div>
          </div>
        </div>
      </div>
      <div class="player p1" data-p="1">
        <div class="fig-wrap"><div class="bubble red"></div><div class="fig"></div></div>
        <input type="text" class="name" maxlength="14" spellcheck="false">
        <div class="score"></div>
      </div>
      <div class="status" id="status"></div>

      <nav class="toolbar">
        <div class="tools tools-info">
          <button class="tool" data-icon="how" data-label="ui.how" data-sheet="how"></button>
          <button class="tool" data-icon="tips" data-label="ui.tips" data-sheet="tips"></button>
          <button class="tool" data-icon="origin" data-label="ui.origin" data-sheet="origin"></button>
        </div>
        <div class="tools tools-play">
          <button class="tool" data-icon="settings" data-label="ui.settings" data-sheet="settings"></button>
          <button class="tool" data-icon="online" data-label="net.btn" id="online"></button>
          <button class="tool" data-icon="undo" data-label="ui.undo" id="undo"></button>
          <button class="tool" data-icon="restart" data-label="ui.restart" id="new"></button>
        </div>
      </nav>
    </main>

    <p class="credit" data-i18n-html="site.credit"></p>
  </div>

  <dialog class="mg-dialog" id="sheet-how">
    <h3 data-i18n="fpl.h.how"></h3>
    <div data-i18n-html="fpl.how"></div>
    <div class="actions"><button class="btn primary" data-close data-i18n="ui.close"></button></div>
  </dialog>
  <dialog class="mg-dialog" id="sheet-tips">
    <h3 data-i18n="fpl.h.tips"></h3>
    <div data-i18n-html="fpl.tips"></div>
  </dialog>
  <dialog class="mg-dialog" id="sheet-origin">
    <h3 data-i18n="fpl.h.origin"></h3>
    <div data-i18n-html="fpl.origin"></div>
    <p class="credit" data-i18n-html="site.credit"></p>
  </dialog>
  <dialog class="mg-dialog" id="sheet-settings">
    <h3 data-i18n="ui.settings.title"></h3>
    <label class="field"><span data-i18n="fpl.variant"></span>
      <select id="variant">
        <option value="classic" data-i18n="fpl.variant.classic"></option>
        <option value="french" data-i18n="fpl.variant.french"></option>
      </select>
    </label>
    <label class="field"><span data-i18n="fpl.mode"></span>
      <select id="mode">
        <option value="pvp" data-i18n="fpl.mode.pvp"></option>
        <option value="easy" data-i18n="fpl.mode.easy"></option>
        <option value="normal" data-i18n="fpl.mode.normal"></option>
        <option value="hard" data-i18n="fpl.mode.hard"></option>
      </select>
    </label>
    <p class="hand settings-note" id="settings-note"></p>
    <div class="actions"><button class="btn primary" data-close data-i18n="ui.close"></button></div>
  </dialog>

  <script type="module" src="game.js"></script>
</body>
</html>
