<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Caveat Emptor · Math Games with Bad Drawings</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="game">
  <div class="page">
    <header class="game-top">
      <a class="back" href="../../index.html" data-i18n-title="site.home" aria-label="back">←</a>
      <h1 data-i18n="ce.title"></h1>
      <div class="lang-toggle"><button data-lang="ru">RU</button><button data-lang="en">EN</button></div>
    </header>

    <main class="arena" id="arena">
      <div class="seats p0" id="seats-a"></div>
      <div class="board-wrap">
        <svg id="board" role="img"></svg>
        <div class="panel" id="panel"></div>
        <div class="result" id="result" hidden>
          <div class="result-card">
            <div class="result-text" id="result-text"></div>
            <p class="result-list hand" id="result-list"></p>
            <p class="result-wait hand" id="result-wait" hidden></p>
            <button class="btn primary" id="again" data-i18n="ce.again"></button>
          </div>
        </div>
      </div>
      <div class="seats p1" id="seats-b"></div>
      <div class="status" id="status"></div>

      <nav class="toolbar">
        <div class="tools tools-info">
          <button class="tool" data-icon="how" data-label="ui.how" data-sheet="how"></button>
          <button class="tool" data-icon="tips" data-label="ui.tips" data-sheet="tips"></button>
          <button class="tool" data-icon="origin" data-label="ui.origin" data-sheet="origin"></button>
        </div>
        <div class="tools tools-play">
          <button class="tool" data-icon="settings" data-label="ui.settings" data-sheet="settings"></button>
          <button class="tool" data-icon="online" data-label="net.btn" id="online"></button>
          <button class="tool" data-icon="undo" data-label="ui.undo" id="undo"></button>
          <button class="tool" data-icon="restart" data-label="ui.restart" id="new"></button>
        </div>
      </nav>
    </main>

    <p class="credit" data-i18n-html="site.credit"></p>
  </div>

  <dialog class="mg-dialog" id="sheet-how">
    <h3 data-i18n="ce.h.how"></h3>
    <div data-i18n-html="ce.how"></div>
    <div class="actions"><button class="btn primary" data-close data-i18n="ui.close"></button></div>
  </dialog>
  <dialog class="mg-dialog" id="sheet-tips">
    <h3 data-i18n="ce.h.tips"></h3>
    <div data-i18n-html="ce.tips"></div>
  </dialog>
  <dialog class="mg-dialog" id="sheet-origin">
    <h3 data-i18n="ce.h.origin"></h3>
    <div data-i18n-html="ce.origin"></div>
    <p class="credit" data-i18n-html="site.credit"></p>
  </dialog>
  <dialog class="mg-dialog" id="sheet-settings">
    <h3 data-i18n="ui.settings.title"></h3>
    <label class="field"><span data-i18n="ce.players"></span>
      <select id="players">
        <option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option>
        <option value="6">6</option><option value="7">7</option><option value="8">8</option>
      </select>
    </label>
    <label class="field" id="cpu-field"><span data-i18n="ce.cpu"></span>
      <select id="cpu"></select>
    </label>
    <label class="field" id="level-field"><span data-i18n="ce.level"></span>
      <select id="level">
        <option value="easy" data-i18n="ce.level.easy"></option>
        <option value="normal" data-i18n="ce.level.normal"></option>
        <option value="hard" data-i18n="ce.level.hard"></option>
      </select>
    </label>
    <label class="field"><span data-i18n="ce.rounds"></span>
      <select id="rounds"></select>
    </label>
    <div class="names-box" id="names-box">
      <div class="names-h hand" data-i18n="ce.names"></div>
      <div class="names" id="names"></div>
    </div>
    <p class="hand settings-note" id="settings-note"></p>
    <div class="actions"><button class="btn primary" data-close data-i18n="ui.close"></button></div>
  </dialog>

  <script type="module" src="game.js"></script>
</body>
</html>
