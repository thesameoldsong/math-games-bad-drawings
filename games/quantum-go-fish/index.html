<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <script src="../../shared/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Quantum Go Fish · Math Games with Bad Drawings</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="game">
  <div class="page">
    <header class="game-top">
      <a class="back" href="../../index.html" data-i18n-title="site.home" aria-label="back">←</a>
      <h1 data-i18n="qgf.title"></h1>
      <div class="lang-toggle"><button class="theme-toggle" type="button"></button><button data-lang="ru">RU</button><button data-lang="en">EN</button></div>
    </header>

    <main class="arena qgf-arena">
      <div class="board-wrap">
        <div id="seats" class="seats"></div>
        <div class="panel-wrap">
          <div id="panel" class="panel"></div>
          <div class="result" id="result" hidden>
            <div class="result-card">
              <div class="result-text" id="result-text"></div>
              <p class="result-why hand" id="result-why"></p>
              <p class="result-wait hand" id="result-wait" hidden></p>
              <button class="btn primary" id="again" data-i18n="qgf.again"></button>
            </div>
          </div>
        </div>
      </div>
      <div class="status" id="status"></div>

      <nav class="toolbar">
        <div class="tools tools-info">
          <button class="tool" data-icon="how" data-label="ui.how" data-sheet="how"></button>
          <button class="tool" data-icon="tips" data-label="ui.tips" data-sheet="tips"></button>
          <button class="tool" data-icon="origin" data-label="ui.origin" data-sheet="origin"></button>
        </div>
        <div class="tools tools-play">
          <button class="tool" data-icon="settings" data-label="ui.settings" data-sheet="settings"></button>
          <button class="tool" data-icon="online" data-label="net.btn" id="online"></button>
          <button class="tool" data-icon="undo" data-label="ui.undo" id="undo"></button>
          <button class="tool" data-icon="restart" data-label="ui.restart" id="new"></button>
        </div>
      </nav>
    </main>

    <p class="credit" data-i18n-html="site.credit"></p>
  </div>

  <dialog class="mg-dialog" id="sheet-how">
    <h3 data-i18n="qgf.h.how"></h3>
    <div data-i18n-html="qgf.how"></div>
    <div class="actions"><button class="btn primary" data-close data-i18n="ui.close"></button></div>
  </dialog>
  <dialog class="mg-dialog" id="sheet-tips">
    <h3 data-i18n="qgf.h.tips"></h3>
    <div data-i18n-html="qgf.tips"></div>
  </dialog>
  <dialog class="mg-dialog" id="sheet-origin">
    <h3 data-i18n="qgf.h.origin"></h3>
    <div data-i18n-html="qgf.origin"></div>
    <p class="credit" data-i18n-html="site.credit"></p>
  </dialog>
  <dialog class="mg-dialog" id="sheet-settings">
    <h3 data-i18n="ui.settings.title"></h3>
    <label class="field"><span data-i18n="qgf.np"></span>
      <select id="np">
        <option value="3">3</option><option value="4">4</option><option value="5">5</option>
        <option value="6">6</option><option value="7">7</option><option value="8">8</option>
      </select>
    </label>
    <label class="field" id="humans-field"><span data-i18n="qgf.humans"></span><select id="humans"></select></label>
    <label class="field" id="level-field"><span data-i18n="qgf.level"></span>
      <select id="level">
        <option value="easy" data-i18n="qgf.level.easy"></option>
        <option value="normal" data-i18n="qgf.level.normal"></option>
      </select>
    </label>
    <label class="field"><span data-i18n="qgf.hints"></span>
      <select id="hints">
        <option value="on" data-i18n="qgf.hints.on"></option>
        <option value="off" data-i18n="qgf.hints.off"></option>
      </select>
    </label>
    <div class="field names-field" id="names-field"><span data-i18n="qgf.names"></span><div id="names" class="names"></div></div>
    <p class="hand settings-note" id="settings-note"></p>
    <div class="actions"><button class="btn primary" data-close data-i18n="ui.close"></button></div>
  </dialog>

  <script type="module" src="game.js"></script>
</body>
</html>
